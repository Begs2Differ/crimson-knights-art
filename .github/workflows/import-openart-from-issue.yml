name: Import OpenArt image from request
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: import-image-request
  cancel-in-progress: false
jobs:
  import:
    if: github.event.issue.user.login == 'Begs2Differ' && startsWith(github.event.issue.title, 'Import OpenArt image:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download image from approved CDN
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.parse,urllib.request
          body=os.environ["ISSUE_BODY"]
          payload=json.loads(body)
          if set(payload)!= {"image_url","filename"}:
              raise SystemExit("Expected only image_url and filename")
          url=payload["image_url"]; name=payload["filename"]
          parsed=urllib.parse.urlparse(url)
          if parsed.scheme!="https" or parsed.hostname!="cdn.openart.ai" or parsed.username or parsed.password:
              raise SystemExit("Only https://cdn.openart.ai image URLs are allowed")
          if not isinstance(name,str) or not name or name in (".","..") or "/" in name or "\\" in name:
              raise SystemExit("Invalid filename")
          ext=pathlib.Path(name).suffix.lower()
          if ext not in (".png",".jpg",".jpeg"):
              raise SystemExit("Only PNG and JPEG files are supported")
          dest=pathlib.Path(name)
          if dest.exists():
              raise SystemExit("Refusing to overwrite an existing image")
          req=urllib.request.Request(url,headers={"User-Agent":"CrimsonKnightsImageImport/1.0"})
          with urllib.request.urlopen(req,timeout=45) as resp:
              if urllib.parse.urlparse(resp.geturl()).hostname!="cdn.openart.ai":
                  raise SystemExit("Unexpected redirect")
              data=resp.read(20_000_001)
          if len(data)>20_000_000:
              raise SystemExit("Image exceeds 20 MB")
          if ext==".png" and not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Not a PNG image")
          if ext in (".jpg",".jpeg") and not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("Not a JPEG image")
          dest.write_bytes(data)
          print("Saved",name,len(data),"bytes")
          PY
      - name: Commit to main
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          filename=$(python3 -c 'import json,os;print(json.loads(os.environ["ISSUE_BODY"])["filename"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$filename"
          git commit -m "Import OpenArt image: $filename"
          git push origin HEAD:main
      - name: Close completed request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Image imported and committed to main."
