name: Import OpenArt image
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: Public image URL on cdn.openart.ai
        required: true
        type: string
      filename:
        description: Filename to save in the repository (PNG or JPG)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: import-openart-image
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download and validate image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          FILENAME: ${{ inputs.filename }}
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.parse, urllib.request
          url = os.environ["IMAGE_URL"]
          name = os.environ["FILENAME"]
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "cdn.openart.ai":
              raise SystemExit("Only https://cdn.openart.ai images are allowed.")
          if not name or name in (".", "..") or "/" in name or "\\" in name:
              raise SystemExit("Filename must be a simple filename with no directories.")
          ext = pathlib.Path(name).suffix.lower()
          if ext not in (".png", ".jpg", ".jpeg"):
              raise SystemExit("Filename must end in .png, .jpg or .jpeg.")
          dest = pathlib.Path(name)
          if dest.exists():
              raise SystemExit("File already exists; refusing to overwrite it.")
          req = urllib.request.Request(url, headers={"User-Agent":"CrimsonKnightsImageImport/1.0"})
          with urllib.request.urlopen(req, timeout=45) as response:
              if urllib.parse.urlparse(response.geturl()).hostname != "cdn.openart.ai":
                  raise SystemExit("Unexpected redirect outside OpenArt CDN.")
              data = response.read(20_000_001)
          if len(data) > 20_000_000:
              raise SystemExit("Image exceeds 20MB.")
          if ext == ".png" and not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("Downloaded data is not a PNG.")
          if ext in (".jpg", ".jpeg") and not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("Downloaded data is not a JPEG.")
          dest.write_bytes(data)
          print(f"Saved {dest} ({len(data)} bytes)")
          PY
      - name: Commit image
        env:
          FILENAME: ${{ inputs.filename }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILENAME"
          git commit -m "Add OpenArt image: $FILENAME"
          git push origin HEAD:main
