name: Import Google Drive image from request
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: import-drive-image
  cancel-in-progress: false
jobs:
  import:
    if: github.event.issue.user.login == 'Begs2Differ' && startsWith(github.event.issue.title, 'Import Drive image:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Drive downloader
        run: python3 -m pip install --user gdown==5.2.0 requests==2.32.3 beautifulsoup4==4.12.3
      - name: Download and validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, requests, urllib.parse
          from bs4 import BeautifulSoup
          data=json.loads(os.environ["ISSUE_BODY"])
          if set(data) != {"file_id","filename"}:
              raise SystemExit("Expected file_id and filename only")
          ident, name=data["file_id"], data["filename"]
          if not isinstance(ident,str) or not re.fullmatch(r"[a-zA-Z0-9_-]{10,150}", ident):
              raise SystemExit("Invalid Drive file ID")
          if not isinstance(name,str) or not name or name in (".","..") or "/" in name or "\\" in name:
              raise SystemExit("Invalid filename")
          ext=pathlib.Path(name).suffix.lower()
          if ext not in (".png",".jpg",".jpeg"):
              raise SystemExit("Only PNG and JPEG supported")
          destination=pathlib.Path(name)
          if destination.exists():
              raise SystemExit("Refusing to overwrite existing file")
          try:
              subprocess.run(["python3","-m","gdown",ident,"-O",name],check=True,timeout=120)
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
              print("gdown did not download; trying Drive browser confirmation flow")
              session=requests.Session()
              session.headers.update({"User-Agent":"Mozilla/5.0"})
              response=session.get("https://drive.google.com/uc",params={"export":"download","id":ident},timeout=45)
              response.raise_for_status()
              if response.content.startswith((b"\\x89PNG\\r\\n\\x1a\\n",b"\\xff\\xd8\\xff")):
                  destination.write_bytes(response.content)
              else:
                  soup=BeautifulSoup(response.text,"html.parser")
                  forms=[form for form in soup.find_all("form") if "download" in (form.get("action") or "")]
                  if not forms:
                      raise SystemExit("Drive did not provide a downloadable file or confirmation form")
                  form=forms[0]
                  action=urllib.parse.urljoin(response.url,form.get("action"))
                  parsed=urllib.parse.urlparse(action)
                  if parsed.scheme!="https" or parsed.hostname not in ("drive.google.com","drive.usercontent.google.com"):
                      raise SystemExit("Unexpected Drive confirmation host")
                  fields={item.get("name"):item.get("value","") for item in form.find_all("input") if item.get("name")}
                  method=(form.get("method") or "get").lower()
                  response=session.post(action,data=fields,timeout=60) if method=="post" else session.get(action,params=fields,timeout=60)
                  response.raise_for_status()
                  destination.write_bytes(response.content)
                  print("Fallback HTTP status",response.status_code,"bytes",len(response.content))
          if destination.stat().st_size > 20_000_000:
              destination.unlink()
              raise SystemExit("Image too large")
          header=destination.open("rb").read(8)
          if ext==".png" and header != b"\x89PNG\r\n\x1a\n":
              destination.unlink()
              raise SystemExit("Downloaded content is not PNG")
          if ext in (".jpg",".jpeg") and not header.startswith(b"\xff\xd8\xff"):
              destination.unlink()
              raise SystemExit("Downloaded content is not JPEG")
          print("Validated",name,destination.stat().st_size)
          PY
      - name: Commit original file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          filename=$(python3 -c 'import json,os;print(json.loads(os.environ["ISSUE_BODY"])["filename"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$filename"
          git commit -m "Import Drive image: $filename"
          git push origin HEAD:main
      - name: Close completed request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Original image imported and committed to main."
